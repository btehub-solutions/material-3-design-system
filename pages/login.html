<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Material 3 Design System</title>
  <meta name="description" content="M3 spec-compliant login template for web applications.">
  <meta name="theme-color" content="#6750A4">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <!-- Theme Init -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../components/bte-card.css">
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
  <!-- Accessible Skip Navigation Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="auth-page">
    <div class="bte-card bte-card--elevated auth-card" role="region" aria-label="Sign in credentials">
      <div class="auth-brand">
        <div class="auth-logo-icon">
          <span class="material-symbols-outlined">lock</span>
        </div>
        <h1 class="md-typescale-headline-small">Welcome back</h1>
        <p class="md-typescale-body-medium text-on-surface-variant">
          Enter your credentials to access your account
        </p>
      </div>

      <!-- Authentication Error State Banner -->
      <div id="login-error" class="auth-feedback-banner mb-3" role="alert">
        <span class="material-symbols-outlined">error</span>
        <span>Invalid credentials provided. Please verify and retry.</span>
      </div>

      <form class="auth-form" id="login-form">
        <md-filled-text-field label="Email address" type="email" id="email-field" required autocomplete="email">
          <md-icon slot="leading-icon"><span class="material-symbols-outlined">mail</span></md-icon>
        </md-filled-text-field>

        <md-filled-text-field label="Password" type="password" id="password-field" required autocomplete="current-password">
          <md-icon slot="leading-icon"><span class="material-symbols-outlined">key</span></md-icon>
        </md-filled-text-field>

        <div class="auth-options">
          <label class="form-label-row">
            <md-checkbox aria-label="Remember me on this device"></md-checkbox>
            <span class="md-typescale-body-medium">Remember me</span>
          </label>
          <md-text-button type="button">Forgot password?</md-text-button>
        </div>

        <md-filled-button type="submit" id="submit-btn" class="w-100">
          Sign in
        </md-filled-button>

        <!-- Loading Indicator for Submit State -->
        <div id="submit-loader" class="justify-center mt-2" hidden>
          <md-circular-progress indeterminate aria-label="Authenticating account"></md-circular-progress>
        </div>

        <div class="text-center mt-2">
          <span class="md-typescale-body-medium text-on-surface-variant">
            Don't have an account?
          </span>
          <a href="onboarding.html" class="no-decoration">
            <md-text-button type="button">Create account</md-text-button>
          </a>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import '@material/web/button/filled-button.js';
    import '@material/web/button/text-button.js';
    import '@material/web/textfield/filled-text-field.js';
    import '@material/web/checkbox/checkbox.js';
    import '@material/web/icon/icon.js';
    import '@material/web/progress/circular-progress.js';

    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitLoader = document.getElementById('submit-loader');
    const errorBanner = document.getElementById('login-error');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      // Demonstrate loading state
      submitBtn.disabled = true;
      submitLoader.hidden = false;
      errorBanner.classList.remove('auth-feedback-banner--visible');

      setTimeout(() => {
        submitBtn.disabled = false;
        submitLoader.hidden = true;
        // Demonstrate error validation feedback state
        errorBanner.classList.add('auth-feedback-banner--visible');
      }, 1000);
    });
  </script>
</body>
</html>
