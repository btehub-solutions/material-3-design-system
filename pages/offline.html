<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Material 3 Design System</title>
  <meta name="description" content="M3 spec-compliant offline page.">
  <meta name="theme-color" content="#6750A4">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <!-- Theme Init -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../components/bte-page-states.css">
  <link rel="stylesheet" href="../styles/error-page.css">
</head>
<body>
  <!-- Accessible Skip Navigation Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="error-page-container">
    <div class="error-page-icon-badge" aria-hidden="true">
      <span class="material-symbols-outlined">cloud_off</span>
    </div>

    <h1 class="md-typescale-display-small">You're offline</h1>
    <h2 class="md-typescale-headline-small mt-2">No internet connection detected</h2>
    <p class="md-typescale-body-large error-page-description">
      Your internet connection is currently unavailable. Cached design system components and documentation remain functional.
    </p>

    <div class="flex-row items-center gap-3">
      <md-filled-button type="button" id="retry-btn">
        <md-icon slot="icon"><span class="material-symbols-outlined">refresh</span></md-icon>
        Retry Connection
      </md-filled-button>

      <a href="../index.html" class="no-decoration">
        <md-outlined-button type="button">
          <md-icon slot="icon"><span class="material-symbols-outlined">home</span></md-icon>
          Home
        </md-outlined-button>
      </a>
    </div>
  </main>

  <script type="module">
    import '@material/web/button/filled-button.js';
    import '@material/web/button/outlined-button.js';
    import '@material/web/icon/icon.js';

    document.getElementById('retry-btn').addEventListener('click', () => {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        alert('Still offline. Please check your network connection.');
      }
    });
  </script>
</body>
</html>
